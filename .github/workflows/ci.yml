name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check src/ tests/ examples/

      - name: Ruff format
        run: ruff format --check src/ tests/ examples/

  test:
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: python
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests/ -v

  typescript:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript
    strategy:
      matrix:
        # 20 is the `engines` floor and the WebCrypto baseline the isomorphic
        # build targets; 22 is current LTS. Both must stay green.
        node-version: ["20", "22"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: typescript/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      # Guards the published package's exports/types map. Without it a broken
      # exports field only surfaces after publish.
      - name: Check package publishability
        run: npm run check:pkg

      # Runs issue -> verify -> resolve through both the ESM and CJS bundles
      # with `Buffer` deleted, so the "zero runtime deps, browser-ready" claim
      # is regression-tested rather than asserted.
      - name: Isomorphic (no-Buffer) check
        run: node scripts/isomorphic-check.mjs
